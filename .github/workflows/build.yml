name: Build PDDReplicaShell

on:
  push:
    branches: [ main, master, feature/1.2.0-auto-search ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          # 下载官方 iOS SDK
          git clone https://github.com/theos/sdks.git $THEOS/sdks
          
          # 安装 ldid
          brew install ldid
          
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build Package
        run: |
          # 进入你的代码子目录（注意路径千万别写错）
          cd PDD_iOS_Tweak_Scaffold_v1.2.0
          
          # 直接执行最标准的打包
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDDReplicaShell-Build
          path: |
            PDD_iOS_Tweak_Scaffold_v1.2.0/packages/*.deb
            PDD_iOS_Tweak_Scaffold_v1.2.0/.theos/obj/**/*.dylib
          if-no-files-found: warn
