name: Build PDDReplicaShell

on:
  push:
    branches: [ main, master, feature/1.2.0-auto-search ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: theos/theos:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        working-directory: PDD_iOS_Tweak_Scaffold_v1.2.0
        run: |
          make clean || true
          # 直接使用完美環境編譯
          make TARGET=iphone:clang:latest:14.0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDDReplicaShell-dylib
          path: PDD_iOS_Tweak_Scaffold_v1.2.0/.theos/obj/**/*.dylib
          if-no-files-found: warn
