name: Build PDDReplicaShell

on:
  push:
    branches: [ main, master, feature/1.2.0-auto-search ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget unzip clang lld xz-utils

      - name: Download Dependencies
        run: |
          mkdir -p deps
          cd deps
          
          echo "Downloading Logos..."
          curl -sL --retry 3 -o logos.zip https://github.com/theos/logos/archive/refs/heads/master.zip
          unzip -q logos.zip
          
          echo "Downloading Headers..."
          curl -sL --retry 3 -o headers.zip https://github.com/theos/headers/archive/refs/heads/master.zip
          unzip -q headers.zip
          
          echo "Downloading SDKs..."
          curl -sL --retry 3 -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          
          echo "Downloading ldid..."
          curl -sL --retry 3 -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid

      - name: Build Dylib
        run: |
          echo "=== Current Directory Structure ==="
          find . -maxdepth 2 -type f | head -n 50
          
          DEPS="$PWD/deps"
          SDK_PATH="$DEPS/sdks-master/iPhoneOS15.6.sdk"
          LOGOS_PL="$DEPS/logos-master/bin/logos.pl"
          HEADERS="$DEPS/headers-master/include"

          # 1. 預處理 Logos (將 .xm 轉為 .mm)
          echo "=== Preprocessing Logos ==="
          perl $LOGOS_PL Tweak.xm > Tweak.mm
          perl $LOGOS_PL PDDInputHooks.xm > PDDInputHooks.mm

          # 2. 直接使用系統 clang 編譯
          echo "=== Compiling Dylib ==="
          clang++ -dynamiclib \
            -arch arm64 -arch arm64e \
            -mios-version-min=14.0 \
            -isysroot "$SDK_PATH" \
            -F"$SDK_PATH/System/Library/Frameworks" \
            -F"$SDK_PATH/System/Library/PrivateFrameworks" \
            -I"$HEADERS" \
            -framework Foundation -framework UIKit -framework CoreFoundation \
            -lz -Wl,-undefined,dynamic_lookup \
            -fobjc-arc -fmodules -fblocks -DTHEOS_PACKAGE_NAME=\"com.local.pddreplicashell\" \
            PDDDiagnostics.m Tweak.mm PDDInputHooks.mm \
            -o PDDReplicaShell.dylib

          # 3. 簽名
          echo "=== Signing Dylib ==="
          $DEPS/ldid -S PDDReplicaShell.dylib
          ls -la PDDReplicaShell.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDDReplicaShell-dylib
          path: PDDReplicaShell.dylib
          if-no-files-found: warn
