name: Build PDDReplicaShell

on:
  push:
    branches: [ main, master, feature/1.2.0-auto-search ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          # 完整拉取 Theos（macOS 环境下不需要管子模块，git 会自动处理）
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          # 安装 ldid，macOS 下直接用 brew 是最稳的
          brew install ldid
          
          # 拉取 iOS SDK
          git clone https://github.com/theos/sdks.git $THEOS/sdks
          
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build Package
        run: |
          # 进入你的源码目录
          cd PDD_iOS_Tweak_Scaffold_v1.2.0
          
          # 直接跑你写的 Makefile，打包出 deb 和 dylib
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDDReplicaShell-Build
          path: |
            PDD_iOS_Tweak_Scaffold_v1.2.0/packages/*.deb
            PDD_iOS_Tweak_Scaffold_v1.2.0/.theos/obj/**/*.dylib
          if-no-files-found: warn
