name: Build PDDReplicaShell

on:
  push:
    branches: [ main, master, feature/1.2.0-auto-search ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          # 安装 clang 和 llvm (包含 llvm-lipo 合并工具)
          sudo apt-get install -y curl wget unzip clang llvm xz-utils

      - name: Download Dependencies
        run: |
          mkdir -p deps
          cd deps
          
          echo "Downloading Logos..."
          curl -fL --retry 5 --retry-delay 2 -o logos.zip https://github.com/theos/logos/archive/refs/heads/master.zip
          unzip -q logos.zip
          
          echo "Downloading Headers..."
          curl -fL --retry 5 --retry-delay 2 -o headers.zip https://github.com/theos/headers/archive/refs/heads/master.zip
          unzip -q headers.zip
          
          echo "Downloading SDKs..."
          curl -fL --retry 5 --retry-delay 2 -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          
          echo "Downloading ldid..."
          curl -fL --retry 5 --retry-delay 2 -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid

      - name: Build Dylib
        run: |
          DEPS="$PWD/deps"
          SDK_PATH="$DEPS/sdks-master/iPhoneOS15.6.sdk"
          LOGOS_PL="$DEPS/logos-master/bin/logos.pl"
          HEADERS="$DEPS/headers-master/include"

          # 进入源码目录 (请确认你的文件夹名字完全一致，如果有拼写错误请修改下面这行)
          cd PDD_iOS_Tweak_Scaffold_v1.2.0
          
          echo "=== 文件列表 ==="
          ls -la

          echo "=== 预处理 Logos ==="
          perl $LOGOS_PL Tweak.xm > Tweak.mm
          if [ -f PDDInputHooks.xm ]; then
            perl $LOGOS_PL PDDInputHooks.xm > PDDInputHooks.mm
          fi

          SOURCES="PDDDiagnostics.m Tweak.mm"
          if [ -f PDDInputHooks.mm ]; then
            SOURCES="$SOURCES PDDInputHooks.mm"
          fi

          # 核心参数：使用 -target 而不是 -arch，完美适配 Linux 的 clang
          CFLAGS="-isysroot $SDK_PATH \
            -F$SDK_PATH/System/Library/Frameworks \
            -F$SDK_PATH/System/Library/PrivateFrameworks \
            -I$HEADERS -I. \
            -framework Foundation -framework UIKit -framework CoreFoundation \
            -Wl,-undefined,dynamic_lookup \
            -fobjc-arc -fmodules -fblocks -dynamiclib"

          echo "=== 编译 arm64 ==="
          clang++ -target arm64-apple-ios14.0 $CFLAGS $SOURCES -o arm64.dylib

          echo "=== 编译 arm64e ==="
          clang++ -target arm64e-apple-ios14.0 $CFLAGS $SOURCES -o arm64e.dylib

          echo "=== 合并双架构 ==="
          llvm-lipo -create -output PDDReplicaShell.dylib arm64.dylib arm64e.dylib

          echo "=== 签名 ==="
          $DEPS/ldid -S PDDReplicaShell.dylib
          
          mv PDDReplicaShell.dylib $GITHUB_WORKSPACE/
          ls -la $GITHUB_WORKSPACE/PDDReplicaShell.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDDReplicaShell-dylib
          path: PDDReplicaShell.dylib
          if-no-files-found: warn
