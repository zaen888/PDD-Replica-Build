name: Build PDDReplicaShell

on:
  push:
    branches: [ main, master, feature/1.2.0-auto-search ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./PDD_iOS_Tweak_Scaffold_v1.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: 'theos'
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'
          theos-sdks-branch: 'master'

      - name: Build
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDDReplicaShell-build
          path: |
            PDD_iOS_Tweak_Scaffold_v1.2.0/packages/*.deb
            PDD_iOS_Tweak_Scaffold_v1.2.0/.theos/obj/**/*.dylib
          if-no-files-found: warn
