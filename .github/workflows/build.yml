name: Build Theos Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        export THEOS=~/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        curl -LO https://github.com/theos/sdks/archive/master.zip
        unzip -q master.zip -d $THEOS/sdks
        mv $THEOS/sdks/sdks-master/* $THEOS/sdks/
        rm -rf $THEOS/sdks/sdks-master master.zip

    - name: Build package
      run: |
        export THEOS=~/theos
        # 注意这里，我们进入了你的文件夹
        cd PDD_iOS_Tweak_Scaffold_v0.4
        make clean package

    - name: Upload Dylib
      uses: actions/upload-artifact@v4
      with:
        name: PDD-Tweak-Dylib
        path: |
          PDD_iOS_Tweak_Scaffold_v0.4/.theos/obj/**/*.dylib
          PDD_iOS_Tweak_Scaffold_v0.4/.theos/_/Library/MobileSubstrate/DynamicLibraries/*.dylib
        if-no-files-found: warn
